name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mutate:
        description: Also run the mutation suite (about 10 minutes)
        type: boolean
        default: false

jobs:
  # Gate 1: a clean clone installs, type-checks, tests and builds with no keys and no network beyond npm.
  clean-clone:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The real pinned release: recomputed against its check_values.json, then the compiled server over stdio.
  release:
    runs-on: ubuntu-latest
    env:
      CLEAR_PRICER_CACHE_DIR: ${{ github.workspace }}/.release-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache the pinned release (keyed on the pin, so a pin bump downloads fresh)
        uses: actions/cache@v4
        with:
          path: .release-cache
          key: release-${{ hashFiles('src/release.ts') }}
      - run: npm run test:release
      - run: npm run build
      - run: npm run smoke
      - name: Mutation suite
        if: ${{ inputs.mutate }}
        run: npm run mutate
